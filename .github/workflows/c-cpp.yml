name: Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-linux:
    # Plus vieille image dispo : glibc/libstdc++ les plus compatibles avec les serveurs
    runs-on: ubuntu-22.04
    steps:
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-multilib
        gcc --version
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        repository: danielga/garrysmod_common
        ref: x86-64-support-sourcesdk
        path: 'garrysmod_common'
    - name: Install Premake
      run: |
        wget https://github.com/premake/premake-core/releases/download/v5.0.0-beta4/premake-5.0.0-beta4-linux.tar.gz -O premake.tar.gz
        tar -xvf premake.tar.gz
        chmod +x premake5
        sudo cp premake5 /usr/bin
    - name: Generate Project
      run: |
        premake5 --gmcommon=garrysmod_common gmake
    - name: Make
      run: |
        cd projects/linux/gmake
        make
        make config=releasewithsymbols_x86_64
    - uses: actions/upload-artifact@v4
      with:
        name: gmsv_eightbit_linux.dll
        path: projects/linux/gmake/x86/ReleaseWithSymbols/gmsv_eightbit_linux.dll
    - uses: actions/upload-artifact@v4
      with:
        name: gmsv_eightbit_linux64.dll
        path: projects/linux/gmake/x86_64/ReleaseWithSymbols/gmsv_eightbit_linux64.dll
  build-windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        repository: danielga/garrysmod_common
        path: 'garrysmod_common'
        ref: x86-64-support-sourcesdk
    - name: Install Premake
      run: |
         curl -L https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-windows.zip -o premake.zip
         tar -xf premake.zip
    - name: Generate Project
      run: |
        ./premake5.exe --gmcommon=garrysmod_common vs2022
    - uses: microsoft/setup-msbuild@v2
    - name: Build
      run: |
        cd projects/windows/vs2022
        msbuild /p:Configuration=ReleaseWithSymbols /p:Platform=Win32 eightbit.sln
        msbuild /p:Configuration=ReleaseWithSymbols /p:Platform=x64 eightbit.sln
    - uses: actions/upload-artifact@v4
      with:
        name: gmsv_eightbit_win32.dll
        path: projects/windows/vs2022/x86/ReleaseWithSymbols/gmsv_eightbit_win32.dll
    - uses: actions/upload-artifact@v4
      with:
        name: gmsv_eightbit_win64.dll
        path: projects/windows/vs2022/x86_64/ReleaseWithSymbols/gmsv_eightbit_win64.dll
